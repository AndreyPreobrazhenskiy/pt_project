version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: nta_api
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: nta_web
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped
